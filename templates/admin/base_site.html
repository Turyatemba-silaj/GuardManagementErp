{% extends "admin/base.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --sentinel-ink: #111827;
        --sentinel-text: #253244;
        --sentinel-muted: #64748b;
        --sentinel-bg: #f4f6f8;
        --sentinel-panel: #ffffff;
        --sentinel-line: #dbe3ec;
        --sentinel-rail: #0b3b78;
        --sentinel-green: #2563eb;
        --sentinel-blue: #2563eb;
        --sentinel-red: #2563eb;
    }

    body {
        margin: 0;
        background: var(--sentinel-bg) !important;
        color: var(--sentinel-text);
        font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 0;
    }

    a { color: #1d4ed8; font-weight: 700; text-decoration: none; }
    a:hover { color: #1d4ed8; text-decoration: none; }

    .app-wrapper {
        min-height: 100vh;
        background: var(--sentinel-bg);
    }

    .main-sidebar,
    .app-sidebar {
        background:
            linear-gradient(180deg, rgba(96, 165, 250, .24), rgba(37, 99, 235, .12) 32%, transparent 66%),
            var(--sentinel-rail) !important;
        color: #f8fafc;
    }

    .brand-link {
        min-height: 66px;
        display: flex;
        align-items: center;
        color: #f8fafc !important;
        background: rgba(8, 47, 104, .55);
        border-bottom: 1px solid rgba(255, 255, 255, .1) !important;
        font-weight: 850;
        letter-spacing: 0;
    }

    .brand-link::before {
        content: "S";
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 10px 0 4px;
        border-radius: 9px;
        background: rgba(147, 197, 253, .22);
        border: 1px solid rgba(191, 219, 254, .42);
        color: #bfdbfe;
        font-weight: 900;
    }

    .brand-link .brand-image { display: none !important; }
    .brand-link .brand-text { font-weight: 850 !important; }

    .user-panel {
        margin: 0 10px 10px;
        padding: 14px 8px !important;
        border-bottom: 1px solid rgba(255, 255, 255, .1) !important;
    }

    .user-panel .info a,
    .sidebar a,
    .app-sidebar a {
        color: #e0f2fe !important;
        font-weight: 750;
    }

    .nav-sidebar .nav-header {
        color: #94a3b8;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: .08em;
        padding: 14px 16px 6px;
        text-transform: uppercase;
    }

    .nav-sidebar .nav-link {
        border-radius: 7px;
        margin: 2px 8px;
        color: #dbeafe !important;
    }

    .nav-sidebar .nav-link.active,
    .nav-sidebar .menu-open > .nav-link {
        background: rgba(96, 165, 250, .24) !important;
        color: #ffffff !important;
        box-shadow: inset 3px 0 0 var(--sentinel-green);
    }

    .nav-sidebar .nav-icon { color: #bfdbfe; }

    .main-header,
    .app-header,
    #jazzy-navbar {
        background: #ffffff !important;
        border-bottom: 1px solid var(--sentinel-line) !important;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }

    .main-header .nav-link,
    .app-header .nav-link {
        color: #334155 !important;
        font-weight: 750;
    }

    .content-wrapper,
    .app-main {
        background: var(--sentinel-bg) !important;
    }

    .content-header h1,
    h1 {
        color: var(--sentinel-ink);
        font-size: 24px;
        font-weight: 850;
        letter-spacing: 0;
    }

    .breadcrumb { font-size: 12px; }

    .card,
    .module,
    fieldset.module,
    .dashboard .card,
    #content-main .card {
        background: var(--sentinel-panel);
        border: 1px solid var(--sentinel-line) !important;
        border-top: 3px solid var(--sentinel-green) !important;
        border-radius: 8px !important;
        box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
        overflow: hidden;
    }

    .card-header,
    .module caption,
    fieldset.module h2 {
        background: #ffffff !important;
        border-bottom: 1px solid var(--sentinel-line) !important;
        color: var(--sentinel-ink) !important;
        font-weight: 850;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
    }

    table thead th,
    table thead td,
    .results thead th {
        background: #f8fafc !important;
        border-bottom: 1px solid var(--sentinel-line) !important;
        color: #475569 !important;
        font-size: 12px;
        font-weight: 850;
        letter-spacing: .04em;
        text-transform: uppercase;
    }

    table td,
    table th {
        padding: 10px 12px;
        border-bottom: 1px solid #edf2f7;
        vertical-align: middle;
    }

    tbody tr:hover { background: #f8fbff; }

    input,
    select,
    textarea,
    .form-control,
    .select2-selection {
        min-height: 38px;
        border: 1px solid #cbd5e1 !important;
        border-radius: 7px !important;
        color: var(--sentinel-text);
    }

    input:focus,
    select:focus,
    textarea:focus,
    .form-control:focus {
        border-color: var(--sentinel-blue) !important;
        box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .12) !important;
        outline: none;
    }

    label,
    .form-group label {
        color: #334155;
        font-size: 12px;
        font-weight: 850;
    }

    .help,
    .helptext,
    .readonly,
    .text-muted {
        color: var(--sentinel-muted) !important;
    }

    .btn,
    input[type="submit"],
    input[type="button"],
    button,
    .button {
        min-height: 36px;
        border-radius: 7px !important;
        font-weight: 800 !important;
        letter-spacing: 0;
    }

    .btn-primary,
    .btn-success,
    input[type="submit"],
    .submit-row input.default {
        background: var(--sentinel-green) !important;
        border-color: var(--sentinel-green) !important;
        color: #ffffff !important;
    }

    .btn-primary:hover,
    .btn-success:hover,
    input[type="submit"]:hover {
        background: #1d4ed8 !important;
        border-color: #1d4ed8 !important;
    }

    .btn-danger,
    .deletelink {
        background: var(--sentinel-red) !important;
        border-color: var(--sentinel-red) !important;
        color: #ffffff !important;
    }

    .object-tools a,
    .historylink,
    .viewsitelink {
        border-radius: 7px !important;
        font-weight: 800;
    }

    .login-page,
    .register-page {
        background:
            radial-gradient(circle at 22% 12%, rgba(96, 165, 250, .3), transparent 30%),
            linear-gradient(135deg, rgba(15, 23, 42, .96), rgba(23, 32, 54, .96)),
            var(--sentinel-rail) !important;
    }

    .login-box,
    .register-box {
        width: min(420px, calc(100vw - 32px));
    }

    .login-logo a,
    .register-logo a {
        color: #f8fafc !important;
        font-weight: 850;
        text-decoration: none;
    }

    .login-logo a::before,
    .register-logo a::before {
        content: "S";
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 10px;
        border-radius: 10px;
        background: rgba(147, 197, 253, .22);
        border: 1px solid rgba(191, 219, 254, .42);
        color: #bfdbfe;
        font-weight: 900;
    }

    .login-card-body,
    .register-card-body {
        border-top: 4px solid var(--sentinel-green);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
    }

    .main-footer {
        border-top: 1px solid var(--sentinel-line);
        color: var(--sentinel-muted);
    }

    @media (max-width: 767.98px) {
        .content-header h1,
        h1 { font-size: 20px; }
        .card,
        .module { border-radius: 6px !important; }
    }
</style>
{% endblock %}
